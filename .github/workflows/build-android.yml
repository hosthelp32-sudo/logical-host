name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip the project zip
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repo root. Upload the project zip first."
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf src && mkdir src && unzip -q "$ZIP" -d src
          SETTINGS=$(find src -name settings.gradle | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::The zip has no settings.gradle inside it."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/logicalhost.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/logicalhost.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing - building an unsigned test app"
          fi

      - name: Build app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd "$PROJECT_DIR"
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle --no-daemon assembleRelease bundleRelease
          else
            gradle --no-daemon assembleDebug
          fi
          cd "$GITHUB_WORKSPACE"
          mkdir -p out
          find "$PROJECT_DIR/app/build/outputs" -name "*.apk" -exec cp {} out/LOGICAL-HOST.apk \;
          find "$PROJECT_DIR/app/build/outputs" -name "*.aab" -exec cp {} out/LOGICAL-HOST-playstore.aab \; || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: LOGICAL-HOST-android
          path: out/

      - name: Publish download on the Releases page
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LOGICAL HOST 1.0.${{ github.run_number }}
          files: out/*
